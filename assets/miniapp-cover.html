<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  /* Source for assets/miniapp-cover.png — BotFather /newapp wants exactly 640x360.
     Rendered at 2x and downscaled, so hairlines and text stay crisp. */
  @page { margin: 0 }
  * { box-sizing: border-box; margin: 0; padding: 0 }

  html, body {
    width: 640px; height: 360px;
    overflow: hidden;
    font: 400 15px/1.4 -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    position: relative;
    width: 640px; height: 360px;
    background:
      radial-gradient(120% 90% at 82% 12%, #24507e 0%, transparent 58%),
      radial-gradient(90% 80% at 8% 96%, #1d3350 0%, transparent 60%),
      linear-gradient(158deg, #101a29 0%, #0b111b 100%);
    color: #eef4fb;
    display: grid;
    grid-template-columns: 1fr 268px;
    align-items: center;
    gap: 26px;
    padding: 38px 40px;
  }

  /* Faint grid, so the flat background has some structure without competing. */
  .stage::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(100% 80% at 30% 40%, #000 30%, transparent 78%);
  }

  .left { position: relative; z-index: 1 }

  .eyebrow {
    display: inline-block;
    font-size: 11.5px; font-weight: 600;
    letter-spacing: .13em; text-transform: uppercase;
    color: #7fb4e4;
    padding: 5px 10px;
    border: 1px solid rgba(127,180,228,.32);
    border-radius: 999px;
    margin-bottom: 16px;
  }

  h1 {
    font-size: 50px; line-height: .95;
    font-weight: 800; letter-spacing: -.03em;
    background: linear-gradient(180deg, #ffffff 30%, #a9c8e8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .tagline {
    margin-top: 13px;
    font-size: 14.5px; line-height: 1.42;
    color: #94aac5; max-width: 270px;
  }

  .games {
    margin-top: 20px;
    font-size: 19px; letter-spacing: 1.5px;
    white-space: nowrap;   /* nine games on one line, always */
    filter: saturate(1.05);
  }

  /* ------------------------------------------------------------ the board */

  .card {
    position: relative; z-index: 1;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 17px;
    padding: 15px 15px 13px;
    box-shadow: 0 22px 44px -18px rgba(0,0,0,.65);
    backdrop-filter: blur(2px);
  }

  .card-head {
    display: flex; align-items: baseline; gap: 7px;
    padding: 0 3px 11px;
    border-bottom: 1px solid rgba(255,255,255,.09);
  }
  .card-head .game { font-size: 14.5px; font-weight: 650 }
  .card-head .day { margin-left: auto; font-size: 11.5px; color: #7e93ad }

  .row {
    display: grid;
    grid-template-columns: 24px 1fr auto 34px;
    align-items: center; gap: 9px;
    padding: 9px 3px;
    font-size: 14px;
  }
  .row + .row { border-top: 1px solid rgba(255,255,255,.055) }
  .row .medal { font-size: 18px; text-align: center; line-height: 1 }
  .row .name { color: #dce7f4 }
  .row .time { font-variant-numeric: tabular-nums; font-weight: 620; color: #ffffff }
  .row .pts {
    text-align: right; font-size: 12px; font-variant-numeric: tabular-nums;
    color: #6fd3a0; font-weight: 600;
  }

  .row.lead { background: rgba(90,175,255,.11); border-radius: 9px }
  .row.lead .name { font-weight: 650; color: #ffffff }
</style>
</head>
<body>
  <div class="stage">
    <div class="left">
      <span class="eyebrow">Daily puzzle league</span>
      <h1>Daily<br />Games</h1>
      <p class="tagline">Private reminders, results by DM, one ranked board in the group every night.</p>
      <div class="games">👑 🌗 🏁 🌀 🪜 ✏️ 🧶 📌 🧮</div>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="game">👑 Queens</span>
        <span class="day">Today</span>
      </div>
      <div class="row lead"><span class="medal">🥇</span><span class="name">Arnaud</span><span class="time">0:11</span><span class="pts">+5</span></div>
      <div class="row"><span class="medal">🥈</span><span class="name">Camille</span><span class="time">0:19</span><span class="pts">+4</span></div>
      <div class="row"><span class="medal">🥉</span><span class="name">Thomas</span><span class="time">0:33</span><span class="pts">+3</span></div>
      <div class="row"><span class="medal">4</span><span class="name">Léa</span><span class="time">1:02</span><span class="pts">+2</span></div>
    </div>
  </div>
</body>
</html>
