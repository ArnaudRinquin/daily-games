<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  /* Source for assets/bot-icon.png — Telegram bot avatar, 512x512.
     Telegram crops avatars to a CIRCLE, so everything that matters stays well
     inside the inscribed circle; the corners carry background only. */
  * { box-sizing: border-box; margin: 0; padding: 0 }
  html, body { width: 512px; height: 512px; overflow: hidden }

  .icon {
    position: relative;
    width: 512px; height: 512px;
    background:
      radial-gradient(78% 62% at 50% 24%, #2b5c92 0%, transparent 62%),
      linear-gradient(158deg, #14243a 0%, #0b111b 100%);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 26px;
    padding-bottom: 132px;
  }

  /* Podium: reads as "leaderboard" at any size, including 40px. */
  .bar {
    width: 78px;
    border-radius: 16px 16px 6px 6px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.16);
  }
  .second { height: 118px; background: linear-gradient(180deg, #7ea8d4, #4b7bab) }
  .first  { height: 196px; background: linear-gradient(180deg, #ffd977, #eab134) }
  .third  { height: 84px;  background: linear-gradient(180deg, #5d84b0, #3a5f8a) }

  /* Ground line, tapered so it never touches the circular crop. */
  .ground {
    position: absolute;
    left: 50%; transform: translateX(-50%);
    bottom: 114px;
    width: 300px; height: 5px;
    border-radius: 3px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.24) 22%, rgba(255,255,255,.24) 78%, transparent);
  }

  /* Star over first place. */
  .star {
    position: absolute;
    left: 50%; transform: translateX(-50%);
    top: 134px;
    font-size: 62px;
    line-height: 1;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,.5));
  }
</style>
</head>
<body>
  <div class="icon">
    <span class="star">⭐️</span>
    <div class="bar second"></div>
    <div class="bar first"></div>
    <div class="bar third"></div>
    <div class="ground"></div>
  </div>
</body>
</html>
